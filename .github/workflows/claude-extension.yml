name: Build Claude Desktop extension

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 pack
      - uses: actions/upload-artifact@v4
        with:
          name: trading212-controlled-mcpb
          path: "*.mcpb"
          if-no-files-found: error
